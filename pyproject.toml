[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4se-agent"
version = "0.1.0"
description = "A coding agent harness with feedback-driven self-correction loop"
readme = "README.md"
authors = [{ name = "AI4SE Student" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "transitions>=0.9.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]

[project.scripts]
ai4se-agent = "ai4se_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = [
    "BLE001",   # blind except: intentional in tools/guard for robustness
    "S110",     # try-except-pass: intentional in event_bus (silent handler failure)
    "B008",     # function call in default: intentional NullTracer sentinel
    "B023",     # closure binds loop var: works correctly (single-iteration loop)
    "DTZ005",   # datetime without tz: used for simple timestamps
    "RUF012",   # mutable class attribute: intentional static class list
    "PLW1510",  # subprocess without check: intentional manual returncode check
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]